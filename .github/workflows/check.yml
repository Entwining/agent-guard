name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Share one Cargo target directory
        # make reads it from the environment, and so does every direct cargo call, such as the verifier's.
        # It sits beside the checkout because the cache step only accepts a target relative to the workspace.
        run: echo "CARGO_TARGET_DIR=${GITHUB_WORKSPACE%/*}/cargo-target" >> "$GITHUB_ENV"
      - name: Cache dependency builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> ../cargo-target"
      - name: Install cargo-nextest, cargo-deny and cargo-about
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        # Each tool installs the newest release on its minor line that this action release lists, with its checksum.
        env:
          # renovate: datasource=crate depName=cargo-nextest
          CARGO_NEXTEST_VERSION: "0.9"
          # renovate: datasource=crate depName=cargo-deny
          CARGO_DENY_VERSION: "0.20"
          # renovate: datasource=crate depName=cargo-about
          CARGO_ABOUT_VERSION: "0.9"
        with:
          tool: cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }},cargo-deny@${{ env.CARGO_DENY_VERSION }},cargo-about@${{ env.CARGO_ABOUT_VERSION }}
          fallback: none
      - name: Check the implementation and development tools
        # cargo-deny fetches the RustSec advisory database; this check requires network access.
        run: make check
        env:
          NEXTEST_PROFILE: ci
      - name: Build and verify the Rust package
        # The build fetches every target's crates to render the license notices; it requires network access.
        run: |
          test "$(uname -m)" = arm64
          make build OUT="$RUNNER_TEMP/package"
          test "$("$RUNNER_TEMP/package/bin/agent-guard" --version)" = "agent-guard $(cat VERSION)"
          cargo run --locked --bin agent-guard-verify -- "$RUNNER_TEMP/package/bin/agent-guard"
          test -s "$RUNNER_TEMP/package/LICENSE-THIRD-PARTY.md"
