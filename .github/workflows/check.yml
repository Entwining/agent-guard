name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Install cargo-deny 0.20.2
        shell: bash
        run: |
          archive="$RUNNER_TEMP/cargo-deny-0.20.2-aarch64-apple-darwin.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-aarch64-apple-darwin.tar.gz
          printf '%s  %s\n' fe67d82a10d8597a3549364cb733a3f9cc1bfff9031b7ae46384a9f2a72090c3 "$archive" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/cargo-deny"
          tar -xzf "$archive" -C "$RUNNER_TEMP/cargo-deny" --strip-components=1
          echo "$RUNNER_TEMP/cargo-deny" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cargo-deny/cargo-deny" --version
      - name: Install cargo-about 0.9.2
        shell: bash
        run: |
          archive="$RUNNER_TEMP/cargo-about-0.9.2-aarch64-apple-darwin.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" \
            https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-aarch64-apple-darwin.tar.gz
          printf '%s  %s\n' ae72f0df0c399a1e96336f696fa55b1b28679fd725632eba8cf8e4568467cc3e "$archive" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/cargo-about"
          tar -xzf "$archive" -C "$RUNNER_TEMP/cargo-about" --strip-components=1
          echo "$RUNNER_TEMP/cargo-about" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cargo-about/cargo-about" --version
      - name: Check the implementation and development tools
        # cargo-deny fetches the RustSec advisory database and cargo fetches every target's crates; this check requires network access.
        run: make check CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-target"
      - name: Build and verify the Rust package
        run: |
          test "$(uname -m)" = arm64
          make build OUT="$RUNNER_TEMP/package" CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-target"
          test "$("$RUNNER_TEMP/package/bin/agent-guard" --version)" = "agent-guard $(cat VERSION)"
          cargo run --locked --bin agent-guard-verify -- "$RUNNER_TEMP/package/bin/agent-guard"
