name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check the implementation and development tools
        run: make check CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-target"
      - name: Build and verify the Rust package
        run: |
          test "$(uname -m)" = arm64
          make build OUT="$RUNNER_TEMP/package" CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-target"
          test "$("$RUNNER_TEMP/package/bin/agent-guard" --version)" = "agent-guard $(cat VERSION)"
          go run ./cmd/agent-guard-verify "$RUNNER_TEMP/package/bin/agent-guard"
