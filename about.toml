# Apache-2.0 comes first for dual-licensed crates: a binary distributed under it needs the license text and any NOTICE file,
# while MIT also needs each copyright notice, and cargo-about keeps license files but not the copyright headers in source files.
accepted = ["Apache-2.0", "MIT", "Unicode-3.0", "Unicode-DFS-2016", "Zlib"]
targets = ["aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

# The crate's MIT expression omits the ICU headers its C runtime compiles.
# Those headers fall under the file's leading ICU 58+ notice, not the third-party sections after it.
[tree-sitter.clarify]
license = "MIT AND Unicode-DFS-2016"

[[tree-sitter.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "c5cfb43042b6b72045f4ba997834d0a7786d2793d91680868b5815b39f14fc78"

[[tree-sitter.clarify.files]]
path = "src/unicode/LICENSE"
license = "Unicode-DFS-2016"
checksum = "6a963526a4cf22b24edb2cb272afe68e3b4e80673119113c547e55fa7ea8e784"
end = "written authorization of the copyright holder."

# The crate's expression omits the Unicode data its tables are generated from.
[regex-syntax.clarify]
license = "(MIT OR Apache-2.0) AND Unicode-DFS-2016"

[[regex-syntax.clarify.files]]
path = "LICENSE-MIT"
license = "MIT"
checksum = "6485b8ed310d3f0340bf1ad1f47645069ce4069dcc6bb46c7d5c6faf41de1fdb"

[[regex-syntax.clarify.files]]
path = "LICENSE-APACHE"
license = "Apache-2.0"
checksum = "a60eea817514531668d7e00765731449fe14d059d3249e0bc93b36de45f759f2"

[[regex-syntax.clarify.files]]
path = "src/unicode_tables/LICENSE-UNICODE"
license = "Unicode-DFS-2016"
checksum = "74db5baf44a41b1000312c673544b3374e4198af5605c7f9080a402cec42cfa3"
