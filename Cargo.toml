[package]
name = "agent-guard-rust"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "MIT"

[[bin]]
name = "agent-guard-rust-slice"
path = "src/main.rs"

[[bin]]
name = "agent-guard-rust-fixture-worker"
